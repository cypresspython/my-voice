<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Voice"><meta name="theme-color" content="#f6f7fa"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>My Voice</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>My Voice</h1><span id="status">Ready to speak</span></header><section id="home" class="grid" aria-label="Communication buttons"><button class="tile green" data-say="yes"><span class="pic">👍</span><span>Yes, please</span></button><button class="tile pink" data-say="no"><span class="pic">✋</span><span>No, thank you</span></button><button class="tile rose" data-say="love"><span class="pic">❤️</span><span>I love you always</span></button><button class="tile yellow" data-say="food"><span class="pic">🍽️</span><span>Food, please</span></button><button class="tile blue" data-say="drink"><span class="pic">🥤</span><span>Drink, please</span></button><button class="tile purple" data-say="bathroom"><span class="pic">🚽</span><span>Bathroom, please</span></button><button class="tile orange" id="painButton"><span class="pic">🤕</span><span>I hurt</span></button><button class="tile red" data-say="help"><span class="pic">🆘</span><span>Help me</span></button></section><section id="pain" hidden><button id="goBack" class="back">← Back to my words</button><h2>Where does it hurt?</h2><div class="grid"><button class="tile orange" data-say="head"><span class="pic">🤕</span><span>Head</span></button><button class="tile orange" data-say="stomach"><span class="pic">🫃</span><span>Stomach</span></button><button class="tile orange" data-say="body"><span class="pic">🧍</span><span>Whole body</span></button><button class="tile orange" data-say="arm"><span class="pic">💪</span><span>Arm</span></button><button class="tile orange" data-say="leg"><span class="pic">🦵</span><span>Leg</span></button><button class="tile orange" data-say="back"><span class="pic">🔙</span><span>Back</span></button><button class="tile orange" data-say="elsewhere"><span class="pic">👉</span><span>Somewhere else</span></button><button class="tile orange" data-say="unsure"><span class="pic">❓</span><span>I don't know</span></button><button class="tile yellow" data-say="little"><span class="pic">👌</span><span>A little</span></button><button class="tile red" data-say="lot"><span class="pic">‼️</span><span>A lot</span></button></div><button class="help" data-say="help">🆘 Help me</button></section><div id="spoken" role="status" aria-live="polite">Tap a picture to speak</div><button id="repeat" disabled>↻ Repeat last message</button><p class="note">Make sure the phone volume is turned up. This app does not call emergency services.</p></main><audio id="player" preload="auto"></audio><script src="app.js"></script></body></html>
